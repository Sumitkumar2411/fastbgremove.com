<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <clipPath id="indiaCircleClip">
      <circle cx="256" cy="256" r="256" />
    </clipPath>
    <g id="spoke">
      <line x1="256" y1="256" x2="256" y2="186" stroke="#000080" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </defs>

  <g clip-path="url(#indiaCircleClip)">
    <!-- Top Saffron Band -->
    <rect x="0" y="0" width="512" height="170.67" fill="#FF9933" />
    <!-- Middle White Band -->
    <rect x="0" y="170.67" width="512" height="170.67" fill="#FFFFFF" />
    <!-- Bottom Green Band -->
    <rect x="0" y="341.33" width="512" height="170.67" fill="#138808" />

    <!-- Ashoka Chakra (Navy Blue #000080) -->
    <!-- Outer Rings -->
    <circle cx="256" cy="256" r="74" stroke="#000080" stroke-width="7" fill="none" />
    <circle cx="256" cy="256" r="70" stroke="#000080" stroke-width="2" fill="none" />

    <!-- 24 Spokes (15 deg intervals) -->
    <use href="#spoke" />
    <use href="#spoke" transform="rotate(15 256 256)" />
    <use href="#spoke" transform="rotate(30 256 256)" />
    <use href="#spoke" transform="rotate(45 256 256)" />
    <use href="#spoke" transform="rotate(60 256 256)" />
    <use href="#spoke" transform="rotate(75 256 256)" />
    <use href="#spoke" transform="rotate(90 256 256)" />
    <use href="#spoke" transform="rotate(105 256 256)" />
    <use href="#spoke" transform="rotate(120 256 256)" />
    <use href="#spoke" transform="rotate(135 256 256)" />
    <use href="#spoke" transform="rotate(150 256 256)" />
    <use href="#spoke" transform="rotate(165 256 256)" />
    <use href="#spoke" transform="rotate(180 256 256)" />
    <use href="#spoke" transform="rotate(195 256 256)" />
    <use href="#spoke" transform="rotate(210 256 256)" />
    <use href="#spoke" transform="rotate(225 256 256)" />
    <use href="#spoke" transform="rotate(240 256 256)" />
    <use href="#spoke" transform="rotate(255 256 256)" />
    <use href="#spoke" transform="rotate(270 256 256)" />
    <use href="#spoke" transform="rotate(285 256 256)" />
    <use href="#spoke" transform="rotate(300 256 256)" />
    <use href="#spoke" transform="rotate(315 256 256)" />
    <use href="#spoke" transform="rotate(330 256 256)" />
    <use href="#spoke" transform="rotate(345 256 256)" />

    <!-- Center Hub Details -->
    <circle cx="256" cy="256" r="16" fill="#000080" />
    <circle cx="256" cy="256" r="8" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="4" fill="#000080" />
  </g>
</svg>
